{{ if not .Params.hide_feedback }}
<div id="pre-footer" class="mb-4">
<!--
  <h2>{{ T "feedback_heading" }}</h2>
  -->
    <div class="feedback-actions">
      <p class="feedback--prompt mb-0">{{ T "feedback_question" }} </p>
      <button class="btn btn-primary me-2 ms-3 feedback--yes"><img src="{{ "images/icon-thumbs-up.svg" | relURL }}" title="dark"/>{{ T "feedback_yes" }}</button>
      <button class="btn btn-primary feedback--no"><img src="{{ "images/icon-thumbs-down.svg" | relURL }}" title="dark"/>{{ T "feedback_no" }}</button>
    </div>

    <div>
      <p class="feedback--response feedback--response__hidden">
        {{ T "layouts_docs_partials_feedback_thanks" }}
        <a target="_blank" rel="noopener"
          href="https://stackoverflow.com/questions/tagged/PlaidCloud">
          Stack Overflow</a>.
        {{ T "layouts_docs_partials_feedback_issue" }}
        <a target="_blank" rel="noopener"
          href="https://plaidcloud.com/contact-us/">
          {{ T "layouts_docs_partials_feedback_improvement" }}</a>.
      </p>
    </div>
  </div>  
  <script>
    const yes = document.querySelector('.feedback--yes');
    const no = document.querySelector('.feedback--no');
    document.querySelectorAll('.feedback--link').forEach(link => {
      link.href = link.href + window.location.pathname;
    });
    const sendFeedback = (value) => {
      if (!gtag) { console.log('!gtag'); }
      gtag('event', 'click', {
        'event_category': 'Helpful',
        'event_label': window.location.pathname,
        value
      });
    };
    const disableButtons = () => {
      yes.disabled = true;
      yes.classList.add('feedback--button__disabled');
      no.disabled = true;
      no.classList.add('feedback--button__disabled');
    };
    yes.addEventListener('click', () => {
      sendFeedback(1);
      disableButtons();
      document.querySelector('.feedback--response').classList.remove('feedback--response__hidden');
    });
    no.addEventListener('click', () => {
      sendFeedback(0);
      disableButtons();
      document.querySelector('.feedback--response').classList.remove('feedback--response__hidden');
    });
  </script>
{{ end }}
