StylesPath = styles
MinAlertLevel = suggestion

Packages = Google

Vocab = PlaidCloud

[*.{md,mdx}]
BasedOnStyles = Vale, Google

# Don't enforce headings style — we use Title Case via our own script.
Google.Headings = NO

# Don't flag we/our in PlaidCloud company voice contexts.
Google.We = NO

# Allow contractions (matches our voice).
Google.Contractions = NO

# House style uses spaced em dashes ( — ); Google wants them unspaced. Keep ours.
Google.EmDash = NO

# Allow second-person ("you") which we use deliberately.
# (no specific rule needed — Vale doesn't flag this)

# Block extension list for fenced code blocks Vale shouldn't lint inside.
TokenIgnores = (?s)(```.+?```)

# Machine-translated locale pages and snippets (scripts/translate.py) aren't English: no English prose rules.
# Paths are matched relative to the repo root, which is where CI's vale-action runs.
[{src/content/docs,src/snippets}/{de,es,fr,pt-br,pt-pt,pl,ja,ko,zh-cn}/**]
BasedOnStyles =
