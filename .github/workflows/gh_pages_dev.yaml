name: GitHub Pages Build Dev

on:
  push:
    branches:
      - dev*
jobs:
  build-dev:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install autoprexir and postcss-cli
        run: npm install --save-dev autoprefixer postcss-cli

      - name: Install docsy level dependencies
        run: (cd themes/docsy && npm install)

      - name: Setup Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Install Hugo with deploy support
        run: |
          git clone --depth 1 --branch v0.145.0 https://github.com/gohugoio/hugo.git
          cd hugo
          go install -tags extended,withdeploy

          # Ensure hugo binary is in PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH

          hugo version

      - id: 'auth'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCS_HUGO_SA_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: Build
        run: hugo --minify --environment dev

      # If this were a main, beta, or production branch we'd deploy here
